[project]
name = "play-api-python"
version = "0.1.0"
description = "BDD API test framework for play-qa.com — Python port of play-api-js / play-api-java"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-bdd>=8.1",
  "allure-pytest-bdd>=2.16",
  "httpx2>=2.12",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "faker>=30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/play_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
bdd_features_base_dir = "features"
# Same default filter as cucumber.js: `tags: '@Run and not @Ignore and not @Bug and not @NotImplemented'`
# Override at runtime: uv run pytest -m Smoke
addopts = "-m 'Run and not Ignore and not Bug and not NotImplemented' --alluredir allure-results -p no:cacheprovider"
markers = [
  "Run: included in the default run",
  "Smoke: critical path subset",
  "Positive: happy path",
  "Negative: error / validation path — must assert status AND error.code",
  "Flow: multi-step end-to-end",
  "Ignore: intentionally skipped",
  "Bug: known failing, excluded from CI",
  "NotImplemented: placeholder, excluded from CI",
]
