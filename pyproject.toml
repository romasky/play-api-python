[project]
name = "play-api-python"
version = "0.1.0"
description = "BDD API test framework for play-qa.com — Python port of play-api-js / play-api-java"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-bdd>=8.1",
  "allure-pytest-bdd>=2.16",
  "httpx2>=2.12",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "faker>=30",
  "ruff>=0.16.5",
  "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/play_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
bdd_features_base_dir = "features"
# Same default filter as cucumber.js: `tags: '@Run and not @Ignore and not @Bug and not @NotImplemented'`
# Override at runtime: uv run pytest -m Smoke
addopts = "-m 'Run and not Ignore and not Bug and not NotImplemented' --alluredir allure-results -p no:cacheprovider"
markers = [
  "Run: included in the default run",
  "Smoke: critical path subset",
  "Positive: happy path",
  "Negative: error / validation path — must assert status AND error.code",
  "Flow: multi-step end-to-end",
  "Ignore: intentionally skipped",
  "Bug: known failing, excluded from CI",
  "NotImplemented: placeholder, excluded from CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous unicode: docstrings use → and — on purpose

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools"]
strict = true
# step functions are wrapped by pytest-bdd decorators and take untyped fixtures — keep them checked but not annotated
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_return_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["allure", "allure_commons.*", "pytest_bdd", "pytest_bdd.*"]
ignore_missing_imports = true
