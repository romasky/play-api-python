name: API Tests — play-qa.com

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      markers:
        description: 'pytest -m expression'
        required: false
        default: 'Run and not Ignore and not Bug and not NotImplemented'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint (ruff) + type-check (mypy) + offline step coverage
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python tools/check_steps.py

      # Allure 3 CLI is a pure-JS npm package — Node is only needed for report generation
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: |
          MARKERS="${{ github.event.inputs.markers || 'Run and not Ignore and not Bug and not NotImplemented' }}"
          BASE_URL="${{ vars.BASE_URL || 'https://www.play-qa.com' }}"
          BASE_URL=$BASE_URL uv run pytest -m "$MARKERS"

      - name: Generate Allure report
        if: always()
        run: npx --yes allure@3 generate allure-results -o allure-report

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results
          retention-days: 30

      - name: Prepare deploy directory
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy-root
          cp -r allure-report deploy-root/${{ github.run_number }}
          cp -r allure-report deploy-root/latest

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: deploy-root
          keep_files: true
